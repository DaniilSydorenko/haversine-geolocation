name: Stage npm Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing Git tag to publish (for example v2.0.0-alpha.1)"
        required: true
        type: string
      confirm_publish:
        description: "Type PUBLISH to authorize the npm staging action"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  verify-and-stage:
    name: Verify and stage npm package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Require explicit publish confirmation
        shell: bash
        env:
          CONFIRM_PUBLISH: ${{ inputs.confirm_publish }}
        run: |
          set -euo pipefail

          if [ "$CONFIRM_PUBLISH" != "PUBLISH" ]; then
            echo "Refusing npm staging because confirm_publish is not exactly PUBLISH"
            exit 1
          fi

      - name: Checkout release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Use trusted-publishing compatible npm
        run: npm install --global npm@11.21.0

      - name: Verify release metadata
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          VERSION=$(node -p "require('./package.json').version")
          EXPECTED_TAG="v$VERSION"

          if [ "$RELEASE_TAG" != "$EXPECTED_TAG" ]; then
            echo "Release tag $RELEASE_TAG does not match package version $VERSION"
            exit 1
          fi

          if [[ "$VERSION" == *-* ]]; then
            DIST_TAG="next"
          else
            echo "Stable npm publication is not enabled by this workflow yet."
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "DIST_TAG=$DIST_TAG" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Quality
        run: npm run quality -- --error-on-warnings --max-diagnostics=none

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check package size
        run: npm run size:check

      - name: Inspect package contents
        run: npm pack --dry-run --json

      - name: Stage package on npm
        run: npm stage publish --access public --tag "$DIST_TAG"
