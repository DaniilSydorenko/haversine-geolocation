name: Stage npm Release

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

jobs:
  verify-and-stage:
    name: Verify and stage npm package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Use trusted-publishing compatible npm
        run: npm install --global npm@11.21.0

      - name: Verify release metadata
        shell: bash
        run: |
          set -euo pipefail

          VERSION=$(node -p "require('./package.json').version")
          EXPECTED_TAG="v$VERSION"
          RELEASE_TAG="${{ github.event.release.tag_name }}"
          RELEASE_IS_PRERELEASE="${{ github.event.release.prerelease }}"

          if [ "$RELEASE_TAG" != "$EXPECTED_TAG" ]; then
            echo "Release tag $RELEASE_TAG does not match package version $VERSION"
            exit 1
          fi

          if [[ "$VERSION" == *-* ]]; then
            DIST_TAG="next"

            if [ "$RELEASE_IS_PRERELEASE" != "true" ]; then
              echo "Prerelease package version $VERSION must use a GitHub prerelease"
              exit 1
            fi
          else
            DIST_TAG="latest"

            if [ "$RELEASE_IS_PRERELEASE" = "true" ]; then
              echo "Stable package version $VERSION must not use a GitHub prerelease"
              exit 1
            fi
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "DIST_TAG=$DIST_TAG" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Inspect package contents
        run: npm pack --dry-run --json

      - name: Stage package on npm
        run: npm stage publish --access public --tag "$DIST_TAG"
