name: Apply Biome formatting

on:
  push:
    branches:
      - ci/biome-quality
    paths:
      - .github/workflows/biome-format-apply.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout quality branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ci/biome-quality
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Biome formatter
        run: npx biome format --write src spec scripts vite.lib.config.ts vite.umd.config.ts vitest.config.ts

      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src spec scripts vite.lib.config.ts vite.umd.config.ts vitest.config.ts

          if git diff --cached --quiet; then
            echo "Biome formatting already clean"
            exit 0
          fi

          git commit -m "style: apply Biome formatting"
          git fetch origin ci/biome-quality
          git rebase origin/ci/biome-quality
          git push origin HEAD:ci/biome-quality
