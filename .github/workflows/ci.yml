name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: xvfb-run --auto-servernum npm test

      - name: Build
        run: npm run build

      - name: Node package smoke test
        run: node -e "const pkg=require('./dist/build.js'); if(typeof pkg.distance!=='function') throw new Error('missing distance export'); const result=pkg.distance({latitude:0,longitude:0},{latitude:0,longitude:1}); if(!Number.isFinite(result)||result<=0) throw new Error('invalid distance result'); if(!pkg.default||typeof pkg.default.getDistanceBetween!=='function') throw new Error('missing legacy default export');"

      - name: Validate npm package contents
        run: |
          npm pack --dry-run --json > pack.json
          node <<'NODE'
          const report = require('./pack.json')[0];
          const files = report.files.map((file) => file.path);

          const required = [
            'dist/build.js',
            'dist/types/index.d.ts',
            'dist/types/legacy.d.ts',
            'dist/types/browser.d.ts',
            'package.json',
          ];
          for (const path of required) {
            if (!files.includes(path)) {
              throw new Error(`Missing required package file: ${path}`);
            }
          }

          const forbidden = files.filter((path) =>
            path.startsWith('src/') ||
            path.startsWith('spec/') ||
            path.startsWith('.github/') ||
            [
              'karma.conf.js',
              'webpack.config.js',
              '.babelrc',
              '.travis.yml',
              'tsconfig.json',
            ].includes(path)
          );

          if (forbidden.length > 0) {
            throw new Error(`Forbidden package files: ${forbidden.join(', ')}`);
          }

          console.log('Validated package files:', files.join(', '));
          NODE
