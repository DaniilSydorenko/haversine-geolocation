name: Refresh alpha lockfile

on:
  push:
    branches:
      - release/2.0.0-alpha.1
    paths:
      - package.json
      - .github/workflows/alpha-lockfile-refresh.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout release branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: release/2.0.0-alpha.1
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Refresh npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json

          if git diff --cached --quiet; then
            echo "package-lock.json is already current"
            exit 0
          fi

          git commit -m "chore: refresh lockfile for 2.0.0-alpha.1"
          git fetch origin release/2.0.0-alpha.1
          git rebase origin/release/2.0.0-alpha.1
          git push origin HEAD:release/2.0.0-alpha.1
