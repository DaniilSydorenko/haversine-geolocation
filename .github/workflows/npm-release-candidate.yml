name: Validate npm Release Candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: "V2 prerelease version to validate (for example 2.0.0-alpha.1)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-release-candidate:
    name: Validate V2 prerelease candidate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Use trusted-publishing compatible npm
        run: npm install --global npm@11.21.0

      - name: Validate requested prerelease version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ ! "$VERSION" =~ ^2\.0\.0-(alpha|beta|rc)\.[0-9]+$ ]]; then
            echo "Expected a V2 prerelease such as 2.0.0-alpha.1, 2.0.0-beta.1 or 2.0.0-rc.1"
            exit 1
          fi

          npm version "$VERSION" --no-git-tag-version --allow-same-version

          ACTUAL_VERSION=$(node -p "require('./package.json').version")
          if [ "$ACTUAL_VERSION" != "$VERSION" ]; then
            echo "package.json version $ACTUAL_VERSION does not match requested $VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Quality
        run: npm run quality

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check package size
        run: npm run size:check

      - name: Validate package contents and version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          npm pack --dry-run --json > pack.json

          node <<'NODE'
          const report = require('./pack.json')[0];
          const expectedVersion = process.env.VERSION;

          if (report.version !== expectedVersion) {
            throw new Error(`Packed version ${report.version} does not match ${expectedVersion}`);
          }

          const files = report.files.map((file) => file.path);
          const required = [
            'dist/build.js',
            'dist/index.cjs',
            'dist/index.mjs',
            'dist/browser.cjs',
            'dist/browser.mjs',
            'dist/legacy.cjs',
            'dist/legacy.mjs',
            'dist/types/index.d.ts',
            'dist/types/legacy.d.ts',
            'dist/types/browser.d.ts',
            'package.json',
          ];

          for (const path of required) {
            if (!files.includes(path)) {
              throw new Error(`Missing required package file: ${path}`);
            }
          }

          const forbidden = files.filter((path) =>
            path.startsWith('src/') ||
            path.startsWith('spec/') ||
            path.startsWith('.github/') ||
            [
              'karma.conf.js',
              'webpack.config.js',
              '.babelrc',
              'tsconfig.json',
              'tsconfig.types.json',
            ].includes(path)
          );

          if (forbidden.length > 0) {
            throw new Error(`Forbidden package files: ${forbidden.join(', ')}`);
          }
          NODE

      - name: Test packed Node consumers
        run: |
          npm pack --json > pack-result.json
          PACKAGE_FILE=$(node -p "require('./pack-result.json')[0].filename")
          PACKAGE_PATH="$GITHUB_WORKSPACE/$PACKAGE_FILE"

          rm -rf /tmp/haversine-release-cjs /tmp/haversine-release-esm

          mkdir -p /tmp/haversine-release-cjs
          cd /tmp/haversine-release-cjs
          npm init -y >/dev/null
          npm install "$PACKAGE_PATH" --ignore-scripts --no-audit --no-fund >/dev/null
          node -e "const pkg=require('haversine-geolocation'); if(typeof pkg.distance!=='function') throw new Error('missing CJS distance export'); const r=pkg.distance({latitude:0,longitude:0},{latitude:0,longitude:1}); if(!Number.isFinite(r)||r<=0) throw new Error('invalid CJS distance');"

          mkdir -p /tmp/haversine-release-esm
          cd /tmp/haversine-release-esm
          npm init -y >/dev/null
          npm pkg set type=module
          npm install "$PACKAGE_PATH" --ignore-scripts --no-audit --no-fund >/dev/null
          node --input-type=module -e "import legacyDefault,{distance} from 'haversine-geolocation'; import {isGeolocationSupported} from 'haversine-geolocation/browser'; import legacy from 'haversine-geolocation/legacy'; const r=distance({latitude:0,longitude:0},{latitude:0,longitude:1}); if(!Number.isFinite(r)||r<=0) throw new Error('invalid ESM distance'); if(typeof isGeolocationSupported!=='function') throw new Error('browser subpath missing'); if(!legacyDefault||!legacy||typeof legacy.getDistanceBetween!=='function') throw new Error('legacy compatibility missing');"

      - name: Test packed TypeScript consumer
        run: |
          npm pack --json > pack-result-ts.json
          PACKAGE_FILE=$(node -p "require('./pack-result-ts.json')[0].filename")
          PACKAGE_PATH="$GITHUB_WORKSPACE/$PACKAGE_FILE"

          rm -rf /tmp/haversine-release-typescript
          cp -R fixtures/typescript-consumer /tmp/haversine-release-typescript

          cd /tmp/haversine-release-typescript
          npm install --ignore-scripts --no-audit --no-fund
          npm install "$PACKAGE_PATH" --ignore-scripts --no-audit --no-fund
          npm run typecheck

      - name: Confirm no publish occurred
        run: |
          echo "Release candidate validation completed."
          echo "This workflow never publishes to npm."
