name: Verify Published Alpha

on:
  pull_request:
    paths:
      - '.github/workflows/verify-published-alpha.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  published-package:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22
          - 24
          - 26

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          registry-url: https://registry.npmjs.org

      - name: Install published alpha
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/haversine-published"
          cd "$RUNNER_TEMP/haversine-published"
          npm init -y >/dev/null
          npm install --no-audit --no-fund haversine-geolocation@2.0.0-alpha.1
          npm install --no-audit --no-fund --save-dev typescript@5.9.3

      - name: Verify published package metadata
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/haversine-published"
          node -e "const p=require('haversine-geolocation/package.json'); if(p.version!=='2.0.0-alpha.1') throw new Error('unexpected published version: '+p.version);"

      - name: Verify CommonJS consumer
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/haversine-published"
          node <<'NODE'
          const pkg = require('haversine-geolocation');
          const browser = require('haversine-geolocation/browser');
          const legacy = require('haversine-geolocation/legacy');

          if (typeof pkg.distance !== 'function') {
            throw new Error('published CJS root is missing distance()');
          }

          const result = pkg.distance(
            { latitude: 0, longitude: 0 },
            { latitude: 0, longitude: 1 }
          );

          if (!Number.isFinite(result) || result <= 0) {
            throw new Error('published CJS distance() returned an invalid result');
          }

          if (!pkg.default || typeof pkg.default.getDistanceBetween !== 'function') {
            throw new Error('published CJS root is missing the legacy default facade');
          }

          if (typeof browser.isGeolocationSupported !== 'function') {
            throw new Error('published CJS browser subpath is invalid');
          }

          if (browser.isGeolocationSupported() !== false) {
            throw new Error('browser adapter should report unsupported in Node');
          }

          if (!legacy.default || typeof legacy.default.getDistanceBetween !== 'function') {
            throw new Error('published CJS legacy subpath is invalid');
          }
          NODE

      - name: Verify ESM consumer
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/haversine-published"
          node --input-type=module <<'NODE'
          import HaversineGeolocation, { distance } from 'haversine-geolocation';
          import { isGeolocationSupported } from 'haversine-geolocation/browser';
          import LegacyHaversineGeolocation from 'haversine-geolocation/legacy';

          const result = distance(
            { latitude: 52.2296756, longitude: 21.0122287 },
            { latitude: 59.9138688, longitude: 10.7522454 }
          );

          if (!Number.isFinite(result) || result <= 0) {
            throw new Error('published ESM distance() returned an invalid result');
          }

          if (typeof HaversineGeolocation.getDistanceBetween !== 'function') {
            throw new Error('published ESM root is missing the legacy default facade');
          }

          if (isGeolocationSupported() !== false) {
            throw new Error('published ESM browser adapter should report unsupported in Node');
          }

          if (typeof LegacyHaversineGeolocation.getDistanceBetween !== 'function') {
            throw new Error('published ESM legacy subpath is invalid');
          }
          NODE

      - name: Verify TypeScript consumer
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/haversine-published"

          cat > consumer.ts <<'TS'
          import HaversineGeolocation, {
            distance,
            nearest,
            type Coordinate,
            type DistanceUnit,
          } from 'haversine-geolocation';
          import {
            getCurrentPosition,
            isGeolocationSupported,
          } from 'haversine-geolocation/browser';
          import LegacyHaversineGeolocation from 'haversine-geolocation/legacy';

          const origin: Coordinate = {
            latitude: 52.2296756,
            longitude: 21.0122287,
          };

          const unit: DistanceUnit = 'km';

          const value: number = distance(
            origin,
            { latitude: 59.9138688, longitude: 10.7522454 },
            { unit },
          );

          const closest = nearest(origin, [
            { id: 'a', latitude: 52.23, longitude: 21.012 },
          ]);

          void value;
          void closest;
          void HaversineGeolocation;
          void LegacyHaversineGeolocation;
          void getCurrentPosition;
          void isGeolocationSupported;
          TS

          cat > tsconfig.json <<'JSON'
          {
            "compilerOptions": {
              "target": "ES2022",
              "module": "NodeNext",
              "moduleResolution": "NodeNext",
              "strict": true,
              "noEmit": true,
              "skipLibCheck": false
            },
            "include": ["consumer.ts"]
          }
          JSON

          npx tsc --project tsconfig.json

      - name: Verify registry signatures and provenance
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/haversine-published"
          npm audit signatures
