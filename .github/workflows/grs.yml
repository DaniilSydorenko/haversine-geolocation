name: GRS Governance

on:
  pull_request:
    paths:
      - ".github/repository.json"
      - ".github/workflows/grs.yml"
      - "README.md"
      - ".gitignore"
      - "LICENSE*"
      - "SECURITY.md"
      - "CONTRIBUTING.md"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/secret-scan.yml"
  push:
    branches: [master]
    paths:
      - ".github/repository.json"
      - ".github/workflows/grs.yml"
      - "README.md"
      - ".gitignore"
      - "LICENSE*"
      - "SECURITY.md"
      - "CONTRIBUTING.md"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/secret-scan.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance:
    name: Validate GRS contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Checkout GRS control plane
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: DaniilSydorenko/.github
          # Reviewed GRS v1 contract; update intentionally via a tested local PR.
          ref: ec50b680e6b3620772c1fbecbbc93349621ecfe1
          path: .grs-control
          persist-credentials: false
      - name: Validate GRS manifest
        run: python3 .grs-control/grs/validator.py .github/repository.json
      - name: Audit deterministic repository surfaces
        run: python3 .grs-control/grs/audit_repository.py .github/repository.json --root .
